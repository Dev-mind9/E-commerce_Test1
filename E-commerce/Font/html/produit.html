<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>ShopElite</title>
    <link rel="stylesheet" href="../Style/stylePRODUIT.css">
</head>
<body>

<header class="header">
    <h1 class="logo">ShopElite</h1>

    <nav class="nav">
        <a href="#">Accueil</a>
        <a href="#">Produits</a>
        <a href="#">Panier</a>
    </nav>

    <div class="header-actions">
        <input type="text" placeholder="Rechercher...">
        <button>🔍</button>
        <span class="cart-count">0</span>
    </div>
</header>

<main>

<!-- FILTRES -->
<section class="filters">
    <h2>Filtres</h2>

    <div class="filter-group">
        <label>Catégorie</label>
        <select>
            <option>Toutes</option>
            <option>Chaussures</option>
            <option>Vêtements</option>
        </select>
    </div>

    <div class="filter-group">
        <label>Prix</label>
        <select>
            <option>Tous</option>
            <option>0 - 50$</option>
            <option>50$ - 100$</option>
        </select>
    </div>
</section>

<!-- PRODUITS -->
<section class="products">
    <h2>Nos Produits</h2>

    <div class="products-grid">

        <!-- PRODUIT 1 -->
        <div class="product-card">
            <div class="product-image">
                <img src="https://via.placeholder.com/300" alt="">
                <span class="badge">-20%</span>
            </div>

            <div class="product-body">
                <h3>Chaussures modernes</h3>
                <p>Confort et style pour tous les jours</p>

                <div class="price">
                    <span class="current">$50</span>
                    <span class="old">$70</span>
                </div>

                <div class="actions">
                    <button class="btn-cart">Ajouter au panier</button>
                    <button class="btn-view">Voir</button>
                </div>
            </div>
        </div>

        <!-- PRODUIT 2 -->
        <div class="product-card">
            <div class="product-image">
                <img src="https://via.placeholder.com/300" alt="">
            </div>

            <div class="product-body">
                <h3>T-shirt tendance</h3>
                <p>Style urbain moderne</p>

                <div class="price">
                    <span class="current">$30</span>
                </div>

                <div class="actions">
                    <button class="btn-cart">Ajouter au panier</button>
                    <button class="btn-view">Voir</button>
                </div>
            </div>
        </div>

    </div>
</section>

</main>

</body>
</html>
