<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panier | ShopElite</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>
    <h1>Votre Panier</h1>
</header>

<section class="cart">

    <!-- ITEM -->
    <div class="cart-item">

        <img src="images/product1.jpg" alt="">

        <div class="cart-details">
            <h3>Chaussures modernes</h3>
            <p>Prix : $50</p>

            <div class="quantity-control">
                <button>-</button>
                <span>1</span>
                <button>+</button>
            </div>
        </div>

        <div class="cart-actions">
            <button class="remove">Supprimer</button>
        </div>

    </div>

</section>

<!-- SUMMARY -->
<section class="summary">

    <h2>Résumé</h2>

    <p>Sous-total : $50</p>
    <p>Livraison : $5</p>
    <h3>Total : $55</h3>

    <button class="checkout">Commander</button>

</section>

</body>
</html>
